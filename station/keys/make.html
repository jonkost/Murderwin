<!doctype html>
<meta charset="utf-8">
<title>Study deck keys</title>
<!--
  The study's Stream Deck faces, in the game's branding (Jon, 28 Oct 2026:
  Manor blue, parchment, brass, wax red; the serif of the titles). Drawn
  here on a canvas and saved as raw RGB, one file a key, to station/keys/,
  which lib/streamdeck.js paints from. To redraw them: serve this folder
  with save-keys.py (`python3 station/keys/save-keys.py`), open
  http://127.0.0.1:4197/make.html in a browser, look, press Save.
-->
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  body { background: #000; color: #F1E8D6; font: 14px system-ui; margin: 16px }
  .deck { display: grid; grid-template-columns: repeat(5, auto); gap: 10px; width: max-content; padding: 10px; background: #111; border-radius: 12px }
  .deck canvas { width: 144px; height: 144px; border-radius: 10px; image-rendering: pixelated }
  .row { display: flex; gap: 24px; align-items: center; margin-top: 16px }
  button { font: 600 16px system-ui; padding: 8px 18px }
</style>
<div class="deck" id="deck"></div>
<div class="row"><span>The corner when right, and when wrong:</span><span id="flash"></span></div>
<div class="row"><button id="save">Save</button><span id="said"></span></div>
<script>
const SIZE = 72
const DECK = [['red', 'blue', '1', '4', 'blank'], ['yellow', 'pink', '2', '5', 'undo'], ['green', 'white', '3', '6', 'submit']]
const BRAND = { blue: '#001925', card: '#0c2634', red: '#bf1925', claret: '#592F32', brass: '#A6A253', parchment: '#F1E8D6', ink: '#1b120c' }
// the keys' colours, near the Lines' own so a key matches what the wall shows
const COLOUR = { red: '#d4202c', yellow: '#f0c330', green: '#1f9d4a', blue: '#2457d6', pink: '#e0459c', white: '#f4efe4' }
const SERIF = '"New York", "Source Serif 4", Georgia, serif'

function ground(g, fill = BRAND.blue) {
  const r = g.createRadialGradient(SIZE / 2, SIZE / 2, 4, SIZE / 2, SIZE / 2, SIZE * 0.75)
  r.addColorStop(0, fill === BRAND.blue ? BRAND.card : fill); r.addColorStop(1, fill)
  g.fillStyle = r; g.fillRect(0, 0, SIZE, SIZE)
}
function rim(g, colour = BRAND.brass, inset = 3, width = 2) {
  g.beginPath(); g.roundRect(inset, inset, SIZE - 2 * inset, SIZE - 2 * inset, 9)
  g.lineWidth = width; g.strokeStyle = colour; g.stroke()
}
function text(g, s, size, y, colour = BRAND.parchment, weight = 600) {
  g.font = `${weight} ${size}px ${SERIF}`; g.fillStyle = colour
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(s, SIZE / 2, y)
}
const DRAW = {
  number(g, n) { ground(g); rim(g); text(g, n, 44, SIZE / 2 + 2) },
  colour(g, n) {
    ground(g); rim(g)
    g.beginPath(); g.roundRect(9, 9, SIZE - 18, SIZE - 18, 7); g.fillStyle = COLOUR[n]; g.fill()
    const dark = n === 'yellow' || n === 'white'
    text(g, n[0].toUpperCase() + n.slice(1), 13, SIZE / 2 + 1, dark ? BRAND.ink : BRAND.parchment, 700)
  },
  undo(g) { ground(g, BRAND.claret); rim(g); text(g, '↶', 26, SIZE / 2 - 9); text(g, 'Undo', 13, SIZE / 2 + 16) },
  submit(g) { ground(g, BRAND.red); rim(g, BRAND.parchment); text(g, '✓', 26, SIZE / 2 - 9); text(g, 'Submit', 13, SIZE / 2 + 16) },
  blank(g) { g.fillStyle = BRAND.blue; g.fillRect(0, 0, SIZE, SIZE) },
  ok(g) { ground(g, '#1f9d4a'); rim(g, BRAND.parchment); text(g, '✓', 40, SIZE / 2 + 2) },
  wrong(g) { ground(g, '#d4202c'); rim(g, BRAND.parchment); text(g, '✕', 36, SIZE / 2 + 2) },
}
function draw(name) {
  const c = document.createElement('canvas'); c.width = c.height = SIZE
  const g = c.getContext('2d')
  if (/^\d$/.test(name)) DRAW.number(g, name)
  else if (COLOUR[name]) DRAW.colour(g, name)
  else DRAW[name](g)
  return c
}
function rgb(c) {
  const d = c.getContext('2d').getImageData(0, 0, SIZE, SIZE).data
  const out = new Uint8Array(SIZE * SIZE * 3)
  for (let i = 0; i < SIZE * SIZE; i++) { out[i * 3] = d[i * 4]; out[i * 3 + 1] = d[i * 4 + 1]; out[i * 3 + 2] = d[i * 4 + 2] }
  return out
}
const NAMES = [...DECK.flat(), 'ok', 'wrong']
document.fonts.load(`600 20px "Source Serif 4"`).then(() => document.fonts.load(`700 20px "Source Serif 4"`)).then(() => {
  const canvases = Object.fromEntries(NAMES.map(n => [n, draw(n)]))
  for (const n of DECK.flat()) document.getElementById('deck').append(canvases[n])
  for (const n of ['ok', 'wrong']) { const c = canvases[n]; c.style.cssText = 'width:144px;height:144px;border-radius:10px'; document.getElementById('flash').append(c) }
  document.getElementById('save').onclick = async () => {
    for (const n of NAMES) await fetch(`/save/${n}.rgb`, { method: 'POST', body: rgb(canvases[n]) })
    document.getElementById('said').textContent = `Saved ${NAMES.length} keys.`
  }
  document.title = 'ready'
})
</script>
